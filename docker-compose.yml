services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: micro_rabbitmq
    restart: unless-stopped
    volumes:
      - rbdata:/var/lib/rabbitmq
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: micro_elasticsearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - microservices-net

  migrate-user:
    image: migrate/migrate
    profiles: ["migration"]
    volumes:
      - ./user-service/database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${USER_DB_URL}", "up"]
    networks:
      - microservices-net

  migrate-product:
    image: migrate/migrate
    profiles: ["migration"]
    volumes:
      - ./product-service/database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${PRODUCT_DB_URL}", "up"]
    networks:
      - microservices-net

  migrate-order:
    image: migrate/migrate
    profiles: ["migration"]
    volumes:
      - ./order-service/database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${ORDER_DB_URL}", "up"]
    networks:
      - microservices-net

  migrate-payment:
    image: migrate/migrate
    profiles: ["migration"]
    volumes:
      - ./payment-service/database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${PAYMENT_DB_URL}", "up"]
    networks:
      - microservices-net

  migrate-notification:
    image: migrate/migrate
    profiles: ["migration"]
    volumes:
      - ./notification-service/database/migrations:/migrations
    command: ["-path", "/migrations", "-database", "${NOTIFICATION_DB_URL}", "up"]
    networks:
      - microservices-net

  user-service:
    build: ./user-service
    restart: unless-stopped
    env_file:
      - ./user-service/.env.docker
    networks:
      - microservices-net

  product-service:
    build: ./product-service
    restart: unless-stopped
    env_file:
      - ./product-service/.env.docker
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    restart: unless-stopped
    env_file:
      - ./order-service/.env.docker
    networks:
      - microservices-net

  payment-service:
    build: ./payment-service
    restart: unless-stopped
    env_file:
      - ./payment-service/.env.docker
    networks:
      - microservices-net

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    env_file:
      - ./notification-service/.env.docker
    networks:
      - microservices-net

  worker-product:
    build: ./product-service
    profiles: ["worker"]
    command: ["./main", "worker"]
    env_file:
      - ./product-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-order-indexing:
    build: ./order-service
    profiles: ["worker"]
    command: ["./main", "worker-order"]
    env_file:
      - ./order-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-order-payment:
    build: ./order-service
    profiles: ["worker"]
    command: ["./main", "worker-payment"]
    env_file:
      - ./order-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-order-status:
    build: ./order-service
    profiles: ["worker"]
    command: ["./main", "worker-update-status"]
    env_file:
      - ./order-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-order-user-snapshot:
    build: ./order-service
    profiles: ["worker"]
    command: ["./main", "worker-user-snapshot"]
    env_file:
      - ./order-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-order-product-snapshot:
    build: ./order-service
    profiles: ["worker"]
    command: ["./main", "worker-product-snapshot"]
    env_file:
      - ./order-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-payment-user-snapshot:
    build: ./payment-service
    profiles: ["worker"]
    command: ["./main", "worker-user-snapshot"]
    env_file:
      - ./payment-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  worker-payment-order-snapshot:
    build: ./payment-service
    profiles: ["worker"]
    command: ["./main", "worker-order-snapshot"]
    env_file:
      - ./payment-service/.env.docker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    container_name: micro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - microservices-net

volumes:
  rbdata:
  esdata:

networks:
  microservices-net:
    driver: bridge