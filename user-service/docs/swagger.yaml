    put:
      consumes:
      - application/json
      description: Update authenticated user's profile data
      parameters:
      - description: Update Data User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateDataUserRequest'
      produces:
      - application/json
      responses:
        "200":
