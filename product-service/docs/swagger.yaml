paths:
  /admin/categories:
    get:
      consumes:
      - application/json
      description: Get paginated list of categories for admin
      parameters:
      - description: Search by name
        in: query
        name: search
        type: string
      - description: 'Order by field (default: created_at)'
        in: query
        name: orderBy
        type: string
      - description: 'Order type ASC or DESC (default: desc)'
        in: query
        name: orderType
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/response.DefaultResponseWithPagination'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.CategoryListAdminResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.DefaultResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.DefaultResponse'
      security:
      - BearerAuth: []
      summary: Get all categories (admin)
      tags:
      - categories
    post:
