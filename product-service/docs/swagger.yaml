definitions:
  request.CartRequest:
    properties:
      product_id:
        type: integer
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  request.CreateCategoryRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
      parent_id:
        type: integer
      status:
        type: boolean
    required:
    - icon
    - name
    - status
    type: object
  request.ProductDetailRequest:
    properties:
      image:
        maxLength: 255
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
      stock:
        type: integer
      weight:
        type: integer
    required:
    - image
    - reguler_price
    - sale_price
    - stock
    - weight
    type: object
  request.ProductRequest:
    properties:
      category_slug:
        maxLength: 100
        type: string
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        type: string
      status:
        type: string
      unit:
        maxLength: 100
        type: string
      variant:
        type: integer
      variant_detail:
        items:
          $ref: '#/definitions/request.ProductDetailRequest'
        type: array
    required:
    - category_slug
    - description
    - name
    - status
    - unit
    - variant
    - variant_detail
    type: object
  request.RemoveImageRequest:
    properties:
      image_url:
        type: string
    type: object
  request.UpdateCategoryRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 255
        type: string
      name:
        maxLength: 100
        type: string
      parent_id:
        type: integer
      status:
        type: boolean
    required:
    - icon
    - name
    - status
    type: object
  response.CategoryListAdminResponse:
    properties:
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        type: boolean
      total_product:
        type: integer
    type: object
  response.CategoryListHomeResponse:
    properties:
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  response.CategoryListShopChildResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  response.CategoryListShopResponse:
    properties:
      child:
        items:
          $ref: '#/definitions/response.CategoryListShopChildResponse'
        type: array
      name:
        type: string
      slug:
        type: string
    type: object
  response.CategoryResponse:
    properties:
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        type: boolean
    type: object
  response.DefaultResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  response.DefaultResponseWithPagination:
    properties:
      data: {}
      message:
        type: string
      pagination:
        $ref: '#/definitions/response.PaginationMeta'
    type: object
  response.PaginationMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total_count:
        type: integer
      total_page:
        type: integer
    type: object
  response.ProductChildHomeResponse:
    properties:
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
      stock:
        type: integer
      weight:
        type: integer
    type: object
  response.ProductChildResponse:
    properties:
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
      stock:
        type: integer
      unit:
        type: string
      weight:
        type: integer
    type: object
  response.ProductDetailResponse:
    properties:
      category_name:
        type: string
      category_slug:
        type: string
      child:
        items:
          $ref: '#/definitions/response.ProductChildResponse'
        type: array
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      parent_id:
        type: integer
      reguler_price:
        type: integer
      sale_price:
        type: integer
      status:
        type: string
      stock:
        type: integer
      unit:
        type: string
      weight:
        type: integer
    type: object
  response.ProductHomeDetailResponse:
    properties:
      category_name:
        type: string
      category_slug:
        type: string
      child:
        items:
          $ref: '#/definitions/response.ProductChildHomeResponse'
        type: array
      description:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
      stock:
        type: integer
      unit:
        type: string
      weight:
        type: integer
    type: object
  response.ProductHomeListResponse:
    properties:
      category_name:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
    type: object
  response.ProductListResponse:
    properties:
      category_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      reguler_price:
        type: integer
      sale_price:
        type: integer
      status:
        type: string
    type: object
