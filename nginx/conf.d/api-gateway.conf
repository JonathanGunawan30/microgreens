server {
    listen 80;
    server_name localhost;

    add_header Access-Control-Allow-Origin      $http_origin always;
    add_header Access-Control-Allow-Methods     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers     'Authorization, Content-Type, Accept' always;
    add_header Access-Control-Allow-Credentials true always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /api/v1/signin {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://user-service:8080/signin;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/v1/signup {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://user-service:8080/signup;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/v1/forgot-password {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://user-service:8080/forgot-password;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/v1/verify-account {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://user-service:8080/verify-account;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /api/v1/update-password {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://user-service:8080/update-password;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/auth/profile {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://user-service:8080/auth/profile;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location = /api/v1/auth/profile/image-upload {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 5m;
        proxy_pass http://user-service:8080/auth/profile/image-upload;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location = /api/v1/auth/logout {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://user-service:8080/auth/logout;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/customers {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://user-service:8080/admin/customers;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/roles {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://user-service:8080/admin/roles;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/image {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 5m;
        proxy_pass http://product-service:8081/admin/image;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/image-upload {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 5m;
        proxy_pass http://product-service:8081/admin/image-upload;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/categories {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://product-service:8081/categories;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/products {
        limit_req zone=general burst=15 nodelay;
        proxy_pass http://product-service:8081/products;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/admin/categories {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://product-service:8081/admin/categories;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/products {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://product-service:8081/admin/products;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/auth/cart {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://product-service:8081/auth/cart;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location = /api/v1/auth/image-upload {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 5m;
        proxy_pass http://product-service:8081/auth/image-upload;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location = /api/v1/auth/image {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://product-service:8081/auth/image;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/auth/orders {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://order-service:8082/auth/orders;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/orders {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://order-service:8082/admin/orders;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location = /api/v1/payments/webhook {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://payment-service:8083/payments/webhook;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/auth/payments {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://payment-service:8083/auth/payments;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/admin/payments {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://payment-service:8083/admin/payments;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/auth/notifications {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://notification-service:8084/auth/notifications;
        include /etc/nginx/conf.d/proxy_params_auth.conf;
    }

    location /api/v1/ws {
        limit_req zone=ws burst=5 nodelay;
        proxy_pass http://notification-service:8084/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    limit_req_status 429;

    error_page 429 /429.json;
    location = /429.json {
        internal;
        add_header Content-Type application/json always;
        return 429 '{"message":"Too Many Requests","data":null}';
    }

    error_page 502 /502.json;
    location = /502.json {
        internal;
        add_header Content-Type application/json always;
        return 502 '{"message":"Service Unavailable","data":null}';
    }

    error_page 404 /404.json;
    location = /404.json {
        internal;
        add_header Content-Type application/json always;
        return 404 '{"message":"Not Found","data":null}';
    }
}